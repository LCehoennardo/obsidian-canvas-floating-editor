name: Release Obsidian plugin

on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create release and attach assets
        uses: obsidianmd/action-release@v1
        with:
          # Built by the previous step; action reads manifest for version
          release-tag: ${{ github.ref_name }}
          release-name: ${{ github.ref_name }}
          asset-list: main.js manifest.json styles.css
